      <div class="corpo">
        <h1>Protótipo B&amp;P · Etapa 1</h1>
        <p>Dados fictícios. "Hoje" é 03/11/2026, dia em que a fatura do Nubank fechou. Siga o caminho: Importar → Conferir → Marcar → Fechamentos → WhatsApp.</p>
        <fieldset><legend>Ir para a tela</legend><div class="chips">
          <button class="chip" data-d="tela" data-v="login">Login</button><button class="chip" data-d="tela" data-v="negado">Acesso negado</button>
          <button class="chip" data-d="tela" data-v="inicio">Início</button><button class="chip" data-d="tela" data-v="cartoes">Cartões</button>
          <button class="chip" data-d="tela" data-v="fatura">Fatura</button><button class="chip" data-d="tela" data-v="importar">Importar</button>

          <button class="chip" data-d="tela" data-v="fechamentos">Fechamentos</button><button class="chip" data-d="tela" data-v="mais">Configurações</button></div></fieldset>
        <fieldset><legend>Estado da tela</legend><div class="chips">
          <button class="chip" data-d="estado" data-v="normal">Normal</button><button class="chip" data-d="estado" data-v="vazio">Vazio</button>
          <button class="chip" data-d="estado" data-v="carregando">Carregando</button><button class="chip" data-d="estado" data-v="erro">Erro</button></div></fieldset>
        <fieldset><legend>Pular no tempo</legend><div class="chips">

          <button class="chip" data-d="momento" data-v="marcado">Tudo marcado</button></div></fieldset>
        <fieldset><legend>Teste de volume</legend><div class="chips"><button class="chip" data-d="grande" data-v="1">Fatura com 247 linhas</button></div></fieldset>
        <fieldset><legend>Tema</legend><div class="chips">
          <button class="chip" data-d="tema" data-v="light">Claro</button><button class="chip" data-d="tema" data-v="dark">Escuro</button><button class="chip" data-d="tema" data-v="auto">Do aparelho</button></div></fieldset>
      </div>
    </details>
